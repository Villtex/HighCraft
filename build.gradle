plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    // "HighCraft: Create" addon - separate jar (see addonJar)
    addon {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Development only: automated in-game test (not packed into the mod jar)
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        if (project.use_create_in_dev.toBoolean()) {
            runtimeClasspath += sourceSets.addon.output
        }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.devtest)
    addModdingDependenciesTo(sourceSets.addon)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (!project.hasProperty('devtest') && project.use_create_in_dev.toBoolean()) {
                sourceSet = sourceSets.addon
            }
            if (project.hasProperty('devtest')) {
                sourceSet = sourceSets.devtest
                programArguments.addAll '--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'hctest'
                jvmArgument '-Dhighcraft.devtest=true'
                jvmArgument "-Dhighcraft.devtest.only=${project.findProperty('devtestOnly') ?: 'all'}"
            }
        }
        server {
            server()
            gameDirectory = project.file(project.use_create_in_dev.toBoolean() ? 'run-server-create' : 'run-server')
            if (project.use_create_in_dev.toBoolean()) {
                sourceSet = sourceSets.addon
            }
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (project.use_create_in_dev.toBoolean()) {
            highcraft_create {
                sourceSet(sourceSets.addon)
            }
        }
        if (project.hasProperty('devtest')) {
            highcraft_devtest {
                sourceSet(sourceSets.devtest)
            }
        }
    }
}

configurations {
    // The test run should load the same runtime mods (JEI, optionally Sodium) as the normal client
    devtestRuntimeOnly.extendsFrom(runtimeOnly)
    addonRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    devtestCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // JEI: only the API at compile time, the full mod at (dev) runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    if (project.use_sodium_in_dev.toBoolean() || project.use_iris_in_dev.toBoolean()) {
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
    }
    if (project.use_iris_in_dev.toBoolean()) {
        runtimeOnly "maven.modrinth:iris:${iris_version}"
    }

    // Addon: compile against Create (SequencedAssemblyItem), optionally start it at runtime
    addonCompileOnly "maven.modrinth:create:${create_version}"
    if (project.use_create_in_dev.toBoolean()) {
        runtimeOnly "maven.modrinth:create:${create_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_version            : jei_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var generateAddonMetadata = tasks.register('generateAddonMetadata', ProcessResources) {
    var props = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            addon_mod_id           : addon_mod_id,
            addon_mod_name         : addon_mod_name,
            addon_mod_version      : addon_mod_version,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors
    ]
    inputs.properties props
    expand props
    from 'src/addon/templates'
    into 'build/generated/sources/addonMetadata'
}
sourceSets.addon.resources.srcDir generateAddonMetadata

// Second jar: HighCraft: Create
var addonJar = tasks.register('addonJar', Jar) {
    group = 'build'
    description = 'Builds the "HighCraft: Create" addon jar'
    archiveBaseName = "${addon_mod_id}-neoforge-${minecraft_version}"
    archiveVersion = addon_mod_version
    from sourceSets.addon.output
    manifest {
        attributes('Implementation-Title': addon_mod_name, 'Implementation-Version': addon_mod_version)
    }
}
tasks.named('assemble') { dependsOn addonJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
